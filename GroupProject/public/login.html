<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning Poker - Login</title>
  <style>
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }
    input, button { margin: 4px; }
  </style>
</head>
<body>
  <!-- TODO(UI-2): restyle to Figma frame 02 Create Game (name + 3 toggles, Q6); separate name-only Join page for invite links (Q8)
       TODO(LOBBY-10): drop the "anonymous" fallback and reject/suffix duplicate names
       TODO(LOBBY-1): after create or join, go to lobby.html (not board.html); creator becomes host by being first in -->
  <h1>Planning Poker</h1>

  <h2>Join a project</h2>
  <input id="user" placeholder="Your name">
  <input id="project" placeholder="Project name">
  <button onclick="join()">Enter</button>

  <h2>Or create one</h2>
  <input id="newProject" placeholder="New project name">
  <button onclick="create()">Create</button>

  <p id="msg"></p>

  <script src="api.js"></script>
  <script>
    // Landing here always starts a fresh login
    sessionStorage.clear();

    async function join() {
      try {
        const user = document.getElementById("user").value.trim();
        const r = await api("/api/login", "POST", { user, project: document.getElementById("project").value });
        sessionStorage.setItem("project", r.project);
        sessionStorage.setItem("user", user || "anonymous");
        location.href = "board.html";
      } catch (e) { msg.textContent = e.message; }
    }
    async function create() {
      try {
        await api("/api/projects", "POST", { name: document.getElementById("newProject").value });
        msg.textContent = "Created! Now join it above.";
        // TODO: auto-login after creation
      } catch (e) { msg.textContent = e.message; }
    }
  </script>
</body>
</html>
